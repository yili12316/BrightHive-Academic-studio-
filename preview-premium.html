<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrightHive Academic Studio Premium Preview</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="auth.css?v=20261011l"></head><body>
<section class="auth-shell"><div class="drift-wall" aria-hidden="true"><div class="drift-plane" id="drift-plane"></div><div class="drift-scrim"></div></div><div class="onboarding-panel"><form class="onboarding-card"><img class="onboarding-logo" src="brighthive-logo.jpg" alt="BrightHive Academic Studio"><p class="onboarding-kicker">BrightHive Academic Studio</p><h1>欢迎加入</h1><p>填写学生信息，与课后班安全连接。</p><label>学生姓名<input placeholder="请输入学生姓名"><small>请填写学生在课后班登记的姓名。</small></label><label>邀请码<input placeholder="请输入邀请码"><small>邀请码由课后班提供，不区分大小写。</small></label><p class="onboarding-error"></p><button class="onboarding-submit" type="button">进入家长中心</button><button class="onboarding-logout" type="button">退出登录</button></form></div></section>
<script>document.querySelector('#drift-plane').innerHTML=Array.from({length:5},(_,column)=>`<div class="drift-column" style="--speed:${[40,49,36,46,42][column]}s;--delay:${[3,18,10,26,7][column]}s">${Array.from({length:16},()=>'<span class="drift-tile"><img src="brighthive-logo.jpg?v=1" alt=""></span>').join('')}</div>`).join('');</script></body></html>
