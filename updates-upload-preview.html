<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>动态上传预览</title><link rel="stylesheet" href="style.css?v=20261011ap"><link rel="stylesheet" href="teacher.css?v=20261011ap"></head><body class="teacher-body"><header class="teacher-topbar"><a class="teacher-logo"><img src="brighthive-logo.png?v=1" alt="BrightHive Academic Studio"></a><div><span>TEACHER PORTAL</span><strong>教师管理中心</strong></div><button class="language-toggle" style="margin-left:auto">English</button></header><div class="teacher-layout"><aside class="teacher-nav"><button><i>⌂</i><span>总览<small>Overview</small></span></button><button class="active"><i>✦</i><span>课后班动态<small>Updates</small></span></button><button><i>☺</i><span>学生与课程<small>Students</small></span></button></aside><main class="teacher-main"><div class="teacher-heading"><div><div class="eyebrow">BrightHive Academic Studio</div><h1>课后班动态</h1><p>发布课堂活动、照片和学习花絮。</p></div></div><button class="teacher-create-update">+</button><div class="teacher-section-grid"><section class="teacher-panel"><h2>发布新动态</h2><p>直接选择照片，填写内容后发布给家长。</p><form class="teacher-form"><label class="update-file-label">上传照片<input type="file" accept="image/*"><span>选择手机或电脑里的照片，最大 8 MB</span></label><label>动态标题<input placeholder="例如：今天的阅读分享"></label><div class="teacher-form-row"><label>分类<input value="课堂动态"></label><label>发布老师<input value="Teacher"></label></div><label>动态内容<textarea placeholder="写下今天的课堂活动…"></textarea></label><button class="teacher-submit">上传并发布动态</button></form></section><section class="teacher-panel"><h2>已发布动态</h2><p>没有动态时显示“暂无”。</p><div class="teacher-empty">暂无</div></section></div></main></div></body></html>
